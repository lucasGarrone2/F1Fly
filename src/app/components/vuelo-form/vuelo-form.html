

<section id="Formulario_Carrera"> 
    
    <div id="header-form">
        <h2>
            @if (!estadoEdicion()) {
                Cargue su nuevo vuelo...
            } @else {
                Edite los datos del vuelo...
            }
        </h2>

        <div>
            <button type="button" id="boton-cerrar" (click)="cerrarFormulario()">
                ❌
            </button>
        </div>
    </div>

    <div>
        <form [formGroup]="form" (ngSubmit)="handleSubmit()">
            <ul>

                <li>
                    <label for="pais_origen">País Origen:</label>
                    <input type="text" id="pais_origen" formControlName="pais_origen" placeholder="Argentina...">
                </li>

                <li>
                    <label for="ciudad_origen">Ciudad Origen:</label>
                    <input type="text" id="ciudad_origen" formControlName="ciudad_origen" placeholder="Buenos Aires...">
                </li>

                <li>
                    <label for="pais_destino">País Destino:</label>
                    <input type="text" id="pais_destino" formControlName="pais_destino" placeholder="España...">
                </li>

                <li>
                    <label for="ciudad_destino">Ciudad Destino:</label>
                    <input type="text" id="ciudad_destino" formControlName="ciudad_destino" placeholder="Barcelona...">
                </li>

                <li>
                    <label for="aerolinea">Aerolínea:</label>
                    <input type="text" id="aerolinea" formControlName="aerolinea" placeholder="Iberia, Aerolíneas, etc.">
                </li>

                <li>
                    <label for="fecha_disponible">Fecha Disponible:</label>
                    <input type="date" id="fecha_disponible" formControlName="fecha_disponible">
                </li>

                <li>
                    <label for="tipo_avion">Tipo de Avión:</label>
                    <input type="text" id="tipo_avion" formControlName="tipo_avion" placeholder="Airbus A320...">
                </li>

                <li>
                    <label for="clase_asiento">Clase Asiento:</label>
                    <input type="text" id="clase_asiento" formControlName="clase_asiento" placeholder="Económica, Business...">
                </li>

                <li>
                    <label for="precio_promedio_ticket_eur">Precio Ticket (€):</label>
                    <input type="number" id="precio_promedio_ticket_eur" formControlName="precio_promedio_ticket_eur">
                </li>

            </ul>

            <button type="submit" id="boton-enviar" [disabled]="form.invalid">
                @if (!estadoEdicion()) {
                    ENVIAR
                } @else {
                    ACTUALIZAR
                }
            </button>
        </form>
    </div>

</section>
